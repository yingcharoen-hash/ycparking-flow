<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>บันทึกหน่วยมิเตอร์ลานจักรยานยนต์ ลาน 2</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-color: #f5f5f7;
  --card-bg: #ffffff;
  --text-main: #1d1d1f;
  --text-muted: #86868b;
  --accent-blue: #0071e3;
  --accent-blue-lt: #e8f2fc;
  --gold: #d8a032; 
  --green: #34c759;
  --green-lt: #ebf9ee;
  --red: #ff3b30;
  --red-lt: #ffeceb;
  --gray100: #f5f5f7;
  --gray200: #e5e5ea;
  --gray400: #8e8e93;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Sarabun", sans-serif;
  background: var(--bg-color);
  color: var(--text-main);
  padding-bottom: 80px;
}
/* Header */
.header {
  background: #000;
  color: #fff;
  padding: 40px 24px 30px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.header-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
.header-sub { font-size: 14px; color: #a1a1a6; }

/* Settings */
.settings-bar {
  background: #fff;
  padding: 12px 24px;
  border-bottom: 1px solid var(--gray200);
  display: flex;
  align-items: center;
  gap: 12px;
}
.settings-bar input {
  flex: 1;
  padding: 8px 12px;
  border: 1px solid var(--gray200);
  border-radius: 8px;
  font-family: inherit;
  font-size: 12px;
}
.settings-bar button {
  padding: 8px 16px;
  background: var(--gray100);
  border: 1px solid var(--gray200);
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  font-size: 12px;
}

/* Form Container */
.container {
  max-width: 600px;
  margin: 24px auto;
  padding: 0 16px;
}
.card {
  background: var(--card-bg);
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.04);
  margin-bottom: 24px;
  border: 1px solid rgba(0,0,0,0.04);
  overflow: hidden;
  max-width: 100%;
  box-sizing: border-box;
}
.card-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Form Elements */
.form-group {
  margin-bottom: 16px;
}
.form-row {
  display: flex;
  gap: 16px;
}
.form-col {
  flex: 1;
}
label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 8px;
}
input[type="text"],
input[type="number"],
input[type="date"],
input[type="time"] {
  width: 100%;
  padding: 14px 16px;
  font-size: 16px;
  border: 1px solid var(--gray200);
  border-radius: 12px;
  background: #fff;
  font-family: inherit;
  transition: all 0.2s;
}
input:focus {
  outline: none;
  border-color: var(--accent-blue);
  box-shadow: 0 0 0 4px var(--accent-blue-lt);
}
input[readonly] {
  background: var(--gray100);
  color: var(--gray400);
  border-color: transparent;
  font-weight: 700;
}
.highlight-input {
  color: var(--accent-blue) !important;
  font-size: 18px !important;
}

/* Camera UI */
.camera-wrap {
  position: relative;
  width: 100%;
  border-radius: 12px;
  overflow: hidden;
  background: #000;
  display: none;
  margin-top: 16px;
}
.camera-wrap video {
  width: 100%;
  max-width: 100%;
  height: auto;
  display: block;
  object-fit: cover;
}
.cancel-cam-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  background: rgba(0,0,0,0.6);
  color: #fff;
  border: none;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
  z-index: 10;
}
.capture-btn {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  width: 64px;
  height: 64px;
  background: rgba(255,255,255,0.4);
  border: 4px solid #fff;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.capture-btn:active { background: rgba(255,255,255,0.8); }
.open-cam-btn {
  width: 100%;
  padding: 16px;
  background: var(--gray100);
  border: 2px dashed var(--gray200);
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.open-cam-btn:hover { background: var(--gray200); color: var(--text-main); border-color: var(--text-muted); }
.retake-btn {
  margin-top: 12px;
  padding: 8px 16px;
  background: var(--gray100);
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  display: none;
}
.retake-btn:hover { background: var(--gray200); }

/* Signature Pad */
.signature-wrap {
  border: 1px solid var(--gray200);
  border-radius: 12px;
  background: #fdfdfd;
  overflow: hidden;
  position: relative;
  touch-action: none; /* prevent scrolling when signing */
}
canvas {
  width: 100%;
  height: 150px;
  display: block;
}
.clear-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  background: var(--gray100);
  border: none;
  padding: 4px 12px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
}
.clear-btn:hover { background: var(--gray200); color: var(--text-main); }

/* Submit Button */
.submit-btn {
  width: 100%;
  padding: 16px;
  background: var(--accent-blue);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.submit-btn:hover { background: #0056b3; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,113,227,0.3); }
.submit-btn:disabled { background: var(--gray400); cursor: not-allowed; transform: none; box-shadow: none; }

/* Status message */
.status-msg {
  padding: 16px;
  border-radius: 12px;
  margin-top: 16px;
  font-size: 14px;
  font-weight: 600;
  text-align: center;
  display: none;
  word-wrap: break-word;
  word-break: break-word;
}
.status-msg.success { background: var(--green-lt); color: var(--green); display: block; }
.status-msg.error { background: var(--red-lt); color: var(--red); display: block; }

/* Loading spinner */
.spinner {
  border: 3px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  border-top: 3px solid #fff;
  width: 20px;
  height: 20px;
  animation: spin 1s linear infinite;
  display: none;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* Table history */
.history-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  font-size: 12px;
}
.history-table th, .history-table td {
  padding: 12px 8px;
  border-bottom: 1px solid var(--gray200);
  text-align: left;
}
.history-table th { color: var(--text-muted); font-weight: 600; }
@media (max-width: 480px) {
  .form-row {
    display: flex;
    flex-direction: row;
    gap: 8px;
  }
  .form-col {
    flex: 1;
    min-width: 0; /* Prevents flex items from overflowing their container */
    width: 50%;
  }
  input[type="date"], input[type="time"], input[type="number"], input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 8px; /* Slightly smaller padding to fit text */
    font-size: 14px; /* Slightly smaller font to fit long Thai dates */
  }
}

@media print {
  body {
    background: #fff;
    padding: 0;
  }
  .header, .card, .history-card {
    box-shadow: none;
    border: none;
    margin: 0;
    padding: 12px 0;
  }
  .card-title {
    margin-bottom: 8px;
    font-size: 16px;
    border-bottom: 1px solid #ddd;
    padding-bottom: 4px;
  }
  /* Hide interactive/unnecessary elements */
  .submit-btn, .print-btn, .open-cam-btn, .retake-btn, .clear-btn, .capture-btn, .cancel-cam-btn, .status-msg, .camera-wrap {
    display: none !important;
  }
  /* Show only what is useful for the paper */
  input, select {
    border: none !important;
    background: transparent !important;
    padding: 4px !important;
    font-size: 14px !important;
  }
  /* Reformat form to save space */
  .form-row {
    margin-bottom: 4px;
  }
  .card {
    page-break-inside: avoid;
  }
  .history-card {
    display: none !important; /* Hide history table on print */
  }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-title">บันทึกหน่วยมิเตอร์ลานจักรยานยนต์ ลาน 2</div>
  <div class="header-sub">แอปพลิเคชันสำหรับแผนกการเงิน (Paperless System)</div>
</div>

<div class="container">
  
  <div class="card">
    <div class="card-title">📝 ข้อมูลมิเตอร์และรายได้</div>
    
    <div class="form-group" style="margin-bottom: 16px;">
      <label>ลานจอดรถจักรยานยนต์</label>
      <select id="parkingLot" style="width: 100%; padding: 12px; border: 1px solid var(--gray200); border-radius: 8px; font-size: 16px; background: #fff;">
        <option value="ลาน 2">ลาน 2</option>
        <option value="ลาน 3">ลาน 3</option>
        <option value="ลาน 4">ลาน 4</option>
      </select>
    </div>

    <div class="form-row">
      <div class="form-col">
        <div class="form-group">
          <label>วันที่</label>
          <input type="date" id="docDate" readonly style="pointer-events: none; background-color: #f5f5f7; color: #555; touch-action: none; -webkit-user-select: none;">
        </div>
      </div>
      <div class="form-col">
        <div class="form-group">
          <label>เวลา</label>
          <input type="time" id="docTime" readonly style="pointer-events: none; background-color: #f5f5f7; color: #555; touch-action: none; -webkit-user-select: none;">
        </div>
      </div>
    </div>

    <div class="form-row">
      <div class="form-col">
        <div class="form-group">
          <label>มิเตอร์เริ่มต้น</label>
          <input type="number" id="startMeter" oninput="calculate()">
        </div>
      </div>
      <div class="form-col">
        <div class="form-group">
          <label>มิเตอร์สุดท้าย</label>
          <input type="number" id="endMeter" oninput="calculate()">
        </div>
      </div>
    </div>

    <div class="form-row">
      <div class="form-col">
        <div class="form-group">
          <label>จำนวนหน่วย</label>
          <input type="number" id="units" readonly>
        </div>
      </div>
      <div class="form-col">
        <div class="form-group">
          <label>รวมเงิน (บาท)</label>
          <input type="number" id="totalMoney" readonly class="highlight-input">
        </div>
      </div>
    </div>

    <div class="form-row">
      <div class="form-col">
        <div class="form-group">
          <label>เงินสด</label>
          <input type="number" id="cash">
        </div>
      </div>
      <div class="form-col">
        <div class="form-group">
          <label>เงินโอน</label>
          <input type="number" id="transfer">
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">📸 ภาพถ่ายมิเตอร์</div>
    
    <div class="form-group" style="margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px dashed var(--gray200);">
      <label>1. มิเตอร์เริ่มต้น</label>
      <button id="openCamBtnStart" class="open-cam-btn" onclick="startCamera('start')">
        <span style="font-size: 32px;">📷</span>
        <span>เปิดกล้องถ่ายมิเตอร์เริ่ม</span>
      </button>
      <div id="cameraWrapStart" class="camera-wrap">
        <button class="cancel-cam-btn" onclick="cancelCamera('start')">❌ ยกเลิก</button>
        <video id="videoElementStart" autoplay playsinline></video>
        <div class="capture-btn" onclick="capturePhoto('start')"></div>
      </div>
      <img id="photoPreviewStart" class="preview-img" style="width: 100% !important; height: auto !important; max-width: 100% !important; display: none;">
      <button id="retakeBtnStart" class="retake-btn" onclick="startCamera('start')">🔄 ถ่ายใหม่</button>
    </div>
    
    <div class="form-group">
      <label>2. มิเตอร์สุดท้าย</label>
      <button id="openCamBtnEnd" class="open-cam-btn" onclick="startCamera('end')">
        <span style="font-size: 32px;">📷</span>
        <span>เปิดกล้องถ่ายมิเตอร์จบ</span>
      </button>
      <div id="cameraWrapEnd" class="camera-wrap">
        <button class="cancel-cam-btn" onclick="cancelCamera('end')">❌ ยกเลิก</button>
        <video id="videoElementEnd" autoplay playsinline></video>
        <div class="capture-btn" onclick="capturePhoto('end')"></div>
      </div>
      <img id="photoPreviewEnd" class="preview-img" style="width: 100% !important; height: auto !important; max-width: 100% !important; display: none;">
      <button id="retakeBtnEnd" class="retake-btn" onclick="startCamera('end')">🔄 ถ่ายใหม่</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">✍️ ลายเซ็นรับรอง</div>
    <div class="form-group">
      <label>ผู้ส่งเงิน (ผู้จดมิเตอร์)</label>
      <div class="signature-wrap">
        <canvas id="senderCanvas"></canvas>
        <button class="clear-btn" onclick="clearCanvas(senderPad)">ล้าง</button>
      </div>
    </div>
    
    <div class="form-group">
      <label>ผู้รับเงิน (การเงิน)</label>
      <div class="signature-wrap">
        <canvas id="receiverCanvas"></canvas>
        <button class="clear-btn" onclick="clearCanvas(receiverPad)">ล้าง</button>
      </div>
    </div>
  </div>

  <div style="display: flex; gap: 12px; margin-bottom: 12px;">
    <button class="submit-btn" id="submitBtn" onclick="submitData()" style="flex: 2;">
      <span class="btn-text">บันทึกข้อมูล</span>
      <div class="spinner" id="spinner"></div>
    </button>
    <button class="submit-btn print-btn" onclick="window.print()" style="flex: 1; background: var(--gray600);">
      🖨️ พิมพ์
    </button>
  </div>
  <div style="text-align: center; font-size: 12px; color: var(--red); margin-top: 12px;">* กรณีบันทึกผิดพลาด ระบบไม่เปิดให้แก้ไขเอง กรุณาแจ้งฝ่ายตรวจสอบเพื่อแก้ไขในระบบหลังบ้าน</div>
  
  <div id="statusMsg" class="status-msg"></div>

  <div class="card" style="margin-top: 24px;">
    <div class="card-title">🕰️ ประวัติการบันทึก (Local)</div>
    <div style="overflow-x: auto;">
      <table class="history-table" id="historyTable">
        <thead>
          <tr>
            <th>เวลา</th>
            <th>เริ่ม-จบ</th>
            <th>หน่วย</th>
            <th>รวมเงิน</th>
          </tr>
        </thead>
        <tbody>
          <!-- injected by JS -->
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- Simple Signature Pad Script -->
<script>
  // Setup Defaults
  document.getElementById('docDate').valueAsDate = new Date();
  
  const now = new Date();
  const hours = String(now.getHours()).padStart(2, '0');
  const minutes = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('docTime').value = `${hours}:${minutes}`;

  // Hardcoded Script URL (Needs to be replaced with the actual /exec URL)
  const scriptUrl = 'https://script.google.com/macros/s/AKfycbx9VgBmGLjVAvDEBCK2ruTMnQswLtB1oZoiMzDlhwuRC9MI95GJoId_QTdQJE8kOw-XPw/exec';

  // Calculate Logic
  function calculate() {
    const start = parseFloat(document.getElementById('startMeter').value) || 0;
    const end = parseFloat(document.getElementById('endMeter').value) || 0;
    
    if (end > 0 && end >= start) {
      const units = end - start;
      const total = units * 5; // 1 unit = 5 baht
      document.getElementById('units').value = units;
      document.getElementById('totalMoney').value = total;
    } else {
      document.getElementById('units').value = '';
      document.getElementById('totalMoney').value = '';
    }
  }

  // Camera Implementation (WebRTC)
  let photoData = { start: '', end: '' };
  let videoStream = null;
  let currentCamType = '';

  async function startCamera(type) {
    currentCamType = type;
    const isStart = type === 'start';
    const suffix = isStart ? 'Start' : 'End';
    
    const video = document.getElementById('videoElement' + suffix);
    const camWrap = document.getElementById('cameraWrap' + suffix);
    const openBtn = document.getElementById('openCamBtn' + suffix);
    const preview = document.getElementById('photoPreview' + suffix);
    const retakeBtn = document.getElementById('retakeBtn' + suffix);

    openBtn.style.display = 'none';
    preview.style.display = 'none';
    retakeBtn.style.display = 'none';
    camWrap.style.display = 'block';

    try {
      if(videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
      }
      videoStream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: "environment" } 
      });
      video.srcObject = videoStream;
    } catch (err) {
      alert("ไม่สามารถเข้าถึงกล้องได้: " + err.message + "\n\nหมายเหตุ: ฟังก์ชันกล้องต้องใช้งานผ่านลิงก์ https:// เท่านั้น");
      camWrap.style.display = 'none';
      openBtn.style.display = 'flex';
    }
  }

  function cancelCamera(type) {
    const isStart = type === 'start';
    const suffix = isStart ? 'Start' : 'End';
    
    if (videoStream) {
      videoStream.getTracks().forEach(track => track.stop());
      videoStream = null;
    }
    
    document.getElementById('cameraWrap' + suffix).style.display = 'none';
    document.getElementById('openCamBtn' + suffix).style.display = 'flex';
  }

  function capturePhoto(type) {
    const isStart = type === 'start';
    const suffix = isStart ? 'Start' : 'End';
    
    const video = document.getElementById('videoElement' + suffix);
    const canvas = document.createElement('canvas');
    
    const MAX_WIDTH = 800;
    let width = video.videoWidth;
    let height = video.videoHeight;
    if (width > MAX_WIDTH) {
      height *= MAX_WIDTH / width;
      width = MAX_WIDTH;
    }
    
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, width, height);
    
    photoData[type] = canvas.toDataURL('image/jpeg', 0.6);
    
    if (videoStream) {
      videoStream.getTracks().forEach(track => track.stop());
      videoStream = null;
    }
    
    document.getElementById('cameraWrap' + suffix).style.display = 'none';
    const preview = document.getElementById('photoPreview' + suffix);
    preview.src = photoData[type];
    preview.style.display = 'block';
    document.getElementById('retakeBtn' + suffix).style.display = 'inline-block';
  }

  // Signature Pad Implementation
  function setupCanvas(canvasId) {
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let lastX = 0;
    let lastY = 0;

    // Resize canvas correctly for CSS scaling
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;

    // Set style
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#000';

    function getMousePos(evt) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      if(evt.touches) {
        return {
          x: (evt.touches[0].clientX - rect.left) * scaleX,
          y: (evt.touches[0].clientY - rect.top) * scaleY
        };
      }
      return {
        x: (evt.clientX - rect.left) * scaleX,
        y: (evt.clientY - rect.top) * scaleY
      };
    }

    function startDraw(e) {
      e.preventDefault();
      isDrawing = true;
      const pos = getMousePos(e);
      lastX = pos.x;
      lastY = pos.y;
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const pos = getMousePos(e);
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
      lastX = pos.x;
      lastY = pos.y;
    }

    function endDraw(e) {
      e.preventDefault();
      isDrawing = false;
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', endDraw);
    canvas.addEventListener('mouseout', endDraw);

    canvas.addEventListener('touchstart', startDraw, {passive: false});
    canvas.addEventListener('touchmove', draw, {passive: false});
    canvas.addEventListener('touchend', endDraw, {passive: false});

    return { canvas, ctx };
  }

  const senderPad = setupCanvas('senderCanvas');
  const receiverPad = setupCanvas('receiverCanvas');

  function clearCanvas(pad) {
    pad.ctx.clearRect(0, 0, pad.canvas.width, pad.canvas.height);
  }
  
  function isCanvasBlank(canvas) {
    const blank = document.createElement('canvas');
    blank.width = canvas.width;
    blank.height = canvas.height;
    return canvas.toDataURL() === blank.toDataURL();
  }

  // Load History
  function loadHistory() {
    const history = JSON.parse(localStorage.getItem('meterApp_history') || '[]');
    const tbody = document.querySelector('#historyTable tbody');
    tbody.innerHTML = '';
    history.slice().reverse().forEach(h => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${h.date || '-'}<br><span style="font-size: 10px; color: #888;">${h.time || '-'}</span></td>
        <td>${h.start || '?'}-${h.end || '?'}</td>
        <td>${h.units || '-'}</td>
        <td>${h.total || '-'} ฿</td>
      `;
      tbody.appendChild(tr);
    });
  }
  loadHistory();

  // Submit Data
  async function submitData() {
    if (!scriptUrl) {
      alert('ยังไม่ได้ใส่ Web App URL ในโค้ดครับ กรุณาแก้ไขโค้ดเพื่อใส่ URL ที่ถูกต้อง');
      return;
    }

    const parkingLot = document.getElementById('parkingLot').value;
    const date = document.getElementById('docDate').value;
    const time = document.getElementById('docTime').value;
    const start = document.getElementById('startMeter').value;
    const end = document.getElementById('endMeter').value;
    const units = document.getElementById('units').value;
    const total = document.getElementById('totalMoney').value;
    const cash = document.getElementById('cash').value;
    const transfer = document.getElementById('transfer').value;

    if(!start || !end || !units || !total) {
      alert('กรุณากรอกเลขมิเตอร์ให้ครบถ้วน');
      return;
    }
    if(!cash && !transfer) {
      alert('กรุณากรอกจำนวน "เงินสด" หรือ "เงินโอน" อย่างน้อย 1 ช่องครับ');
      return;
    }

    const numTotal = parseFloat(total) || 0;
    const numCash = parseFloat(cash) || 0;
    const numTransfer = parseFloat(transfer) || 0;
    
    if (numCash + numTransfer !== numTotal) {
      if (!confirm('⚠️ ยอดรวมเงินสดและเงินโอน (' + (numCash + numTransfer) + ' บาท) ไม่ตรงกับยอดรวมเงิน (' + numTotal + ' บาท)\n\nคุณต้องการยืนยันการบันทึกข้อมูลหรือไม่?')) {
        return;
      }
    }
    
    let sSign = isCanvasBlank(senderPad.canvas) ? '' : senderPad.canvas.toDataURL('image/png');
    let rSign = isCanvasBlank(receiverPad.canvas) ? '' : receiverPad.canvas.toDataURL('image/png');

    const parkingLot = document.getElementById('parkingLot').value;
    const payload = {
      parkingLot: parkingLot,
      date: date,
      time: time,
      startMeter: start,
      endMeter: end,
      units: units,
      totalMoney: total,
      cash: cash || '0',
      transfer: transfer || '0',
      photoStart: photoData['start'],
      photoEnd: photoData['end'],
      senderSign: sSign,
      receiverSign: rSign
    };

    const btn = document.getElementById('submitBtn');
    const spinner = document.getElementById('spinner');
    const btnText = document.querySelector('.btn-text');
    const msg = document.getElementById('statusMsg');

    btn.disabled = true;
    spinner.style.display = 'block';
    btnText.innerText = 'กำลังส่งข้อมูล...';
    msg.className = 'status-msg';

    try {
      // Use no-cors to prevent CORS issues. The response will be opaque, so we assume success.
      await fetch(scriptUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      
      // Since mode is no-cors, we can't read response.json(), so we assume success if no network error thrown.
      msg.innerText = '✅ บันทึกข้อมูลลง Google Sheets สำเร็จ!';
      msg.className = 'status-msg success';
      
      // Save to local history
      const history = JSON.parse(localStorage.getItem('meterApp_history') || '[]');
      history.push({ date, time, start, end, units, total });
      localStorage.setItem('meterApp_history', JSON.stringify(history));
      loadHistory();
      
      // Reset form slightly
      document.getElementById('startMeter').value = ''; // Auto-fill next start meter
      document.getElementById('endMeter').value = '';
      document.getElementById('units').value = '';
      document.getElementById('totalMoney').value = '';
      document.getElementById('cash').value = '';
      document.getElementById('transfer').value = '';
      document.getElementById('openCamBtnStart').style.display = 'flex';
      document.getElementById('photoPreviewStart').style.display = 'none';
      document.getElementById('retakeBtnStart').style.display = 'none';
      document.getElementById('openCamBtnEnd').style.display = 'flex';
      document.getElementById('photoPreviewEnd').style.display = 'none';
      document.getElementById('retakeBtnEnd').style.display = 'none';
      photoData = { start: '', end: '' };
      clearCanvas(senderPad);
      clearCanvas(receiverPad);

      window.scrollTo(0, document.body.scrollHeight);
    } catch (e) {
      msg.innerText = '❌ เชื่อมต่อล้มเหลว: ' + e.message + ' (อาจเกิดจากปัญหา CORS หรือ URL ผิด)';
      msg.className = 'status-msg error';
    } finally {
      btn.disabled = false;
      spinner.style.display = 'none';
      btnText.innerText = 'บันทึกข้อมูล';
    }
  }

</script>
</body>
</html>
